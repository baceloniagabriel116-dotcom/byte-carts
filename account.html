<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>My Account - Byte Cart</title>
 <link rel="stylesheet" href="css/styles.css?v=26">
 <style>
     
     
     
    .container {
      max-width: none;
      padding-left: 3rem;
      padding-right: 3rem;
    }

    .account-shell {
      width: 100%;
      min-height: calc(100vh - 200px);
      display: flex;
      flex-direction: column;
    }

     
    .account-card {
      width: 100%;
    }

    .account-card table {
      width: 100%;
    }

    .reviews-grid .review-item {
      width: 100%;
    }

    .account-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
      margin-bottom: 1.5rem;
    }

    .tab-btn {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      padding: 0.85rem 1.5rem;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      color: #94A3B8;
      transition: color 0.25s, border-color 0.25s, background-color 0.25s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-radius: 0.5rem 0.5rem 0 0;
    }

    .tab-btn:hover {
      color: #E2E8F0;
    }

    .tab-btn.active {
      color: #60A5FA;
      background: rgba(96, 165, 250, 0.1);
    }

    .tab-content {
      display: none;
      flex: 1;
      width: 100%;
    }

    .tab-content.active {
      display: block;
    }

    .account-card {
      background: linear-gradient(180deg, #1E293B, #1A2436);
      border: 1px solid rgba(51, 65, 85, 0.6);
      border-radius: 0.6rem;
      padding: 1.5rem;
      color: #E2E8F0;
      box-shadow:
        -5px -5px 12px rgba(2, 6, 23, 0.5),
        5px -5px 12px rgba(2, 6, 23, 0.5),
        -5px 5px 12px rgba(2, 6, 23, 0.5),
        5px 5px 12px rgba(2, 6, 23, 0.5);
      height: 100%;
    }

    .account-card h2 {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 1.25rem;
      color: #F8FAFC;
      padding-bottom: 0.25rem;
    }

     
    .account-card + .account-card,
    .account-card + .settings-grid .account-card {
      margin-top: 2rem;
    }

     
    .info-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      align-items: stretch;
    }

     
    .info-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(4, auto);
      grid-auto-flow: column;
      gap: 0.85rem 1.25rem;
    }

    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      padding: 1.05rem 1.35rem;
      background: rgba(30, 42, 76, 0.5);
      border: 1px solid rgba(51, 65, 85, 0.55);
      border-radius: 0.65rem;
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .info-row:hover {
      background: rgba(37, 51, 89, 0.75);
      border-color: rgba(96, 165, 250, 0.45);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px -8px rgba(2, 6, 23, 0.6);
    }

    .info-row:last-child {
      border-bottom: 1px solid rgba(51, 65, 85, 0.55);
    }
    .info-row .detail-label {
      margin: 0;
      flex-shrink: 0;
      font-size: 0.8rem;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
      min-width: 190px;
    }

    .info-row .detail-value {
      margin: 0;
      flex: 1;
      text-align: left;
      padding-left: 3rem;
      font-size: 1rem;
    }

    .info-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 1.25rem;
    }

    .detail-row {
      margin-bottom: 1rem;
    }

    .detail-label {
      color: #94A3B8;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.2rem;
    }

    .detail-value {
      font-size: 0.95rem;
      font-weight: 500;
      color: #F1F5F9;
      word-break: break-word;
    }

    .tier-badge {
      display: inline-block;
      background: rgba(245, 158, 11, 0.18);
      color: #FCD34D;
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 999px;
      padding: 0.2rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 700;
    }

     
    .account-card table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    .account-card th {
      text-align: left;
      padding: 0.6rem;
      color: #93C5FD;
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.04em;
    }

    .account-card td {
      padding: 0.75rem 0.6rem;
      color: #CBD5E1;
      vertical-align: top;
      transition: background-color 0.2s ease;
    }

     
    .reviews-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    .review-item {
      border: 1px solid rgba(51, 65, 85, 0.6);
      border-radius: 0.5rem;
      padding: 0.85rem;
      background: rgba(11, 17, 32, 0.4);
    }

    .review-item .review-stars {
      color: #FBBF24;
    }

    .review-item p {
      margin: 0.4rem 0;
      color: #CBD5E1;
      font-size: 0.88rem;
    }

    .review-item small {
      color: #64748B;
    }

     
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      align-items: stretch;
    }

    .settings-card label.setting-label {
      display: block;
      color: #94A3B8;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 0.9rem 0 0.3rem;
    }

    .settings-card input[type="password"],
    .settings-card input[type="text"] {
      width: 100%;
      background: rgba(11, 17, 32, 0.6);
      border: 1px solid rgba(51, 65, 85, 0.8);
      border-radius: 0.4rem;
      padding: 0.6rem 0.75rem;
      color: #F1F5F9;
      font-size: 0.9rem;
    }

    .settings-card input[type="password"]:focus,
    .settings-card input[type="text"]:focus {
      outline: none;
      border-color: #60A5FA;
    }

     

    .check-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.7rem 0.5rem;
      color: #CBD5E1;
      font-size: 0.9rem;
      cursor: pointer;
      border-radius: 0.5rem;
      transition: background-color 0.2s ease;
    }

    .check-row:hover {
      background: rgba(96, 165, 250, 0.06);
    }

     

     
    .danger-divider {
      position: relative;
    }

    .check-row input {
      accent-color: #60A5FA;
      width: 1.05rem;
      height: 1.05rem;
      cursor: pointer;
    }

    .account-empty {
      color: #94A3B8;
      text-align: center;
      padding: 2.5rem 0.5rem;
      font-size: 0.9rem;
    }

    @media (max-width: 900px) {
      .info-list {
        grid-template-columns: 1fr;
        grid-template-rows: none;
        grid-auto-flow: row;
      }
    }

    @media (max-width: 700px) {
      .info-grid,
      .settings-grid {
        grid-template-columns: 1fr;
      }

      .tab-btn {
        padding: 0.7rem 1rem;
        font-size: 0.85rem;
      }
    }

    




    :root {
      --bc-surface: #1E293B;
      --bc-line: rgba(51, 65, 85, 0.6);
      --bc-accent: #60A5FA;
      --bc-radius: 0.75rem;
    }

     
    .account-shell h1 {
      font-size: 2.25rem;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    .account-headline {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
      padding-bottom: 1.75rem;
      margin-bottom: 1.75rem;
    }

     
    .account-card h2 {
      padding-bottom: 0.5rem;
      margin-bottom: 1.25rem;
    }

    .account-headline .headline-sub {
      margin: 0;
      color: #94A3B8;
      font-size: 0.95rem;
    }

     
    .account-card h2,
    .account-card .account-empty,
    .account-card table {
      text-align: left;
    }

    .account-empty {
      text-align: center;  
    }

     
    .account-card {
      border-radius: var(--bc-radius);
      padding: 2rem;
      box-shadow:
        0 1px 2px rgba(2, 6, 23, 0.4),
        0 8px 24px -8px rgba(2, 6, 23, 0.6);
      transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
    }

    .account-card:hover {
      border-color: rgba(96, 165, 250, 0.35);
      box-shadow:
        0 1px 2px rgba(2, 6, 23, 0.4),
        0 12px 32px -8px rgba(2, 6, 23, 0.7);
    }

    .account-card + .account-card,
    .account-card + .settings-grid .account-card {
      margin-top: 2.25rem;
    }

    .account-card h2 {
      font-size: 1.25rem;
      letter-spacing: -0.01em;
      padding-bottom: 0.75rem;
      margin-bottom: 1.5rem;
    }

     
    .account-tabs {
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    .tab-btn {
      padding: 0.9rem 1.4rem;
      border-radius: 0.5rem 0.5rem 0 0;
      position: relative;
    }

    .tab-btn:hover {
      background: rgba(96, 165, 250, 0.07);
      color: #F1F5F9;
    }

    .tab-btn.active::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -2px;
      width: 100%;
      transform: translateX(-50%);
      box-shadow: 0 6px 14px -4px rgba(96, 165, 250, 0.55);
    }

     
    @media (max-width: 700px) {
      .tab-btn.active::after {
        display: none;
      }
    }

    .tab-btn:focus-visible {
      outline: 2px solid var(--bc-accent);
      outline-offset: 2px;
      border-radius: 0.5rem;
    }

     
    .info-row .detail-value {
      padding-left: 1rem;
    }

     
    .account-card th {
      padding: 0.75rem 0.85rem;
    }

    .account-card tbody tr {
      transition: background-color 0.2s ease;
    }

    .account-card tbody tr:hover {
      background: rgba(96, 165, 250, 0.06);
    }

    .account-card td {
      padding: 0.85rem;
    }

     
    .review-item {
      padding: 1.15rem 1.25rem;
      border-radius: 0.6rem;
      transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .review-item:hover {
      border-color: rgba(96, 165, 250, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -8px rgba(2, 6, 23, 0.6);
    }

     
    .settings-card input[type="password"],
    .settings-card input[type="text"] {
      border-radius: 0.5rem;
      padding: 0.75rem 0.9rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .settings-card input[type="password"]:focus,
    .settings-card input[type="text"]:focus {
      border-color: var(--bc-accent);
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.18);
    }

     
    .check-row {
      padding: 0.7rem 0.5rem;
      border-radius: 0.5rem;
      transition: background-color 0.2s ease;
    }

    .check-row:hover {
      background: rgba(96, 165, 250, 0.06);
    }

     
    .account-empty {
      border: 1px dashed rgba(96, 165, 250, 0.4);
      border-radius: 0.6rem;
      background: rgba(11, 17, 32, 0.35);
      padding: 3rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .account-empty .empty-icon {
      font-size: 2.5rem;
      line-height: 1;
      margin-bottom: 0.25rem;
    }

    .account-empty .empty-title {
      color: #F1F5F9;
      font-size: 1.05rem;
      font-weight: 600;
    }

    .account-empty .empty-sub {
      color: #CBD5E1;
      font-size: 0.9rem;
      max-width: 40ch;
    }

    .account-empty .btn {
      margin-top: 0.75rem;
    }

     
    .account-card .btn {
      transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .account-card .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.1);
    }

    .account-card .btn:active {
      transform: translateY(0);
    }

     
    .tier-badge {
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.08);
    }

     
    .tab-content.active {
      animation: tabFadeIn 0.25s ease;
    }

    @keyframes tabFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

     
    @media (prefers-reduced-motion: reduce) {
      .account-card,
      .info-row,
      .review-item,
      .tab-content.active,
      .account-card .btn {
        transition: none;
        animation: none;
      }
    }

     
    @media (max-width: 700px) {
      .container {
        padding-left: 1rem !important;
        padding-right: 1rem !important;
      }

      .account-card {
        padding: 1.25rem;
      }

      .account-shell h1 {
        font-size: 1.6rem;
      }

      .account-headline {
        flex-direction: column;
        align-items: stretch;
        gap: 1rem;
      }

      .info-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.35rem;
        padding: 0.9rem 0.75rem;
      }

      .info-row .detail-value {
        padding-left: 0;
      }

      .info-footer .btn,
      .settings-card form .btn {
        width: 100%;
      }

      .account-tabs {
        gap: 0.25rem;
        border-bottom: none;
      }

      .tab-btn {
        flex: 1 1 40%;
        justify-content: center;
        border: 1px solid var(--bc-line);
        border-radius: 0.5rem;
        margin-bottom: 0;
      }

      .tab-btn.active {
        background: rgba(96, 165, 250, 0.12);
        border-color: rgba(96, 165, 250, 0.5);
      }

      .order-modal {
        width: 94vw !important;
        max-height: 90vh;
        overflow-y: auto;
      }
    }

     
    @media (min-width: 701px) and (max-width: 900px) {
      .account-card {
        padding: 1.5rem;
      }
    }
 </style>

 <script>
    function normalizeRemoteOrder(order) {
      return {
        ...order,
        id: Number(order.id),
        userId: String(order.userId ?? order.user_id ?? ""),
        items: typeof order.items === "string" ? JSON.parse(order.items || "[]") : (order.items || []),
        total: Number(order.total || 0),
        shippingDetails: typeof (order.shippingDetails || order.shipping_details) === "string"
          ? JSON.parse(order.shippingDetails || order.shipping_details || "{}")
          : (order.shippingDetails || order.shipping_details || {}),
        orderNumber: order.orderNumber || order.order_number,
        createdAt: order.createdAt || order.created_at
      };
    }

    document.addEventListener("DOMContentLoaded", async () => {
      if (!authManager.isLoggedIn()) {
        document.getElementById("authCheck").innerHTML = `
          <div style="background: #eff6ff; border: 2px solid #3b82f6; border-radius: 0.5rem; padding: 2rem; text-align: center;">
            <h2 style="font-size: 1.5rem; font-weight: bold; margin-bottom: 1rem;">Login Required</h2>
            <p style="color: #666; margin-bottom: 2rem;">You need to be logged in to view your account.</p>
            <a href="login.html?redirect=account.html" class="btn btn-primary">Go to Login</a>
          </div>
        `;
        return;
      }

      const user = authManager.getCurrentUser();
      let userOrders = cartManager.getUserOrders();
      let userReviews = [];
      try {
        const [remoteOrders, remoteReviews] = await Promise.all([
          database.fetchAPI("get_orders"),
          database.fetchAPI("get_reviews")
        ]);
        userOrders = remoteOrders
          .map(normalizeRemoteOrder)
          .filter(order => String(order.userId) === String(user.id));
        userReviews = remoteReviews.filter(review => String(review.user_id) === String(user.id));
      } catch (error) {
        console.warn("Account history sync failed:", error.message);
      }
      window.accountOrders = userOrders;

      const fmt = n => "PHP " + Number(n || 0).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      const statusBadge = status => {
        const s = String(status || "pending").toLowerCase();
        const styles = {
          pending: "background:rgba(245,158,11,.18); color:#FCD34D;",
          shipped: "background:rgba(56,189,248,.18); color:#7DD3FC;",
          completed: "background:rgba(34,197,94,.18); color:#86EFAC;",
          cancelled: "background:rgba(239,68,68,.18); color:#FCA5A5;"
        };
        return `<span style="${styles[s] || styles.completed} padding:0.2rem 0.6rem; border-radius:9999px; font-size:0.75rem; font-weight:600;">${s.charAt(0).toUpperCase() + s.slice(1)}</span>`;
      };

      const ordersTable = userOrders.length === 0 ? `
        <div class="account-empty">
          <div class="empty-title">You have not placed any orders yet.</div>
          <a href="products.html" class="btn btn-primary">Start Shopping</a>
        </div>` : `
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr><th>Order #</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th><th></th></tr>
            </thead>
            <tbody>
              ${userOrders.map(order => `
                <tr>
                  <td style="font-weight:600; color:#F1F5F9;">${order.orderNumber}</td>
                  <td>${new Date(order.createdAt).toLocaleDateString()}</td>
                  <td>${order.items.length} item(s)</td>
                  <td style="font-weight:600; color:#60A5FA;">${fmt(order.total)}</td>
                  <td>${statusBadge(order.status)}</td>
                  <td><button onclick="viewOrder(${order.id})" class="btn btn-secondary" style="padding:0.3rem 0.7rem; font-size:0.8rem;">View</button></td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>`;

      document.getElementById("authCheck").innerHTML = `
        <div class="account-shell">
          <div class="account-headline">
            <div>
              <h1 style="margin-bottom: 0.35rem;">My Account</h1>
              <p class="headline-sub">Manage your profile, orders, reviews, and security settings.</p>
            </div>
            <a href="products.html" class="btn btn-primary">Browse Products</a>
          </div>

          <nav class="account-tabs" role="tablist" aria-label="Account sections">
            <button class="tab-btn active" data-tab="userinfo" role="tab" aria-selected="true" onclick="switchTab('userinfo')">User Info</button>
            <button class="tab-btn" data-tab="orders" role="tab" aria-selected="false" onclick="switchTab('orders')">Order History</button>
            <button class="tab-btn" data-tab="reviews" role="tab" aria-selected="false" onclick="switchTab('reviews')">Review History</button>
            <button class="tab-btn" data-tab="settings" role="tab" aria-selected="false" onclick="switchTab('settings')">Settings</button>
          </nav>

           
          <section id="userinfo" class="tab-content active" role="tabpanel">
            <div class="account-card">
              <h2>Account Details</h2>
              <div class="info-list">
                <div class="info-row"><div class="detail-label">Full Name</div><div class="detail-value">${user.firstName} ${user.lastName}</div></div>
                <div class="info-row"><div class="detail-label">Email</div><div class="detail-value">${user.email}</div></div>
                <div class="info-row"><div class="detail-label">Phone Number</div><div class="detail-value">${user.phone || "Not set"}</div></div>
                <div class="info-row"><div class="detail-label">Account Created</div><div class="detail-value">${user.createdAt ? new Date(user.createdAt).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" }) : "—"}</div></div>
                <div class="info-row"><div class="detail-label">Default Shipping Address</div><div class="detail-value">${user.address || "Not set"}</div></div>
                <div class="info-row"><div class="detail-label">Default Billing Address</div><div class="detail-value">${user.billingAddress || user.address || "Same as shipping address"}</div></div>
                <div class="info-row"><div class="detail-label">Preferred Payment Method</div><div class="detail-value">${user.paymentMethod || "Cash on Delivery"}</div></div>
                <div class="info-row"><div class="detail-label">Account Role</div><div class="detail-value"><span class="tier-badge">${user.role === "admin" ? "Administrator" : "User"}</span></div></div>
              </div>
              <div class="info-footer">
                <button onclick="editProfile()" class="btn btn-primary">Edit Profile</button>
              </div>
            </div>
          </section>

           
          <section id="orders" class="tab-content" role="tabpanel">
            <div class="account-card">
              <h2>Order History</h2>
              ${ordersTable}
            </div>
          </section>

           
          <section id="reviews" class="tab-content" role="tabpanel">
            <div class="account-card">
              <h2>My Reviews</h2>
              ${userReviews.length === 0 ? `
                <div class="account-empty">
                  <div class="empty-title">You have not written any reviews yet.</div>
                </div>
              ` : `
                <div class="reviews-grid">
                  ${userReviews.map(review => `
                    <article class="review-item">
                      <div style="display:flex; justify-content:space-between; gap:0.75rem; align-items:baseline;">
                        <strong style="color:#F1F5F9; font-size:0.9rem;">Product #${review.product_id}</strong>
                        <span class="review-stars">${"★".repeat(Math.min(5, Number(review.rating_stars || review.rating || 0)))}</span>
                      </div>
                      <p>${review.comment}</p>
                      <small>${new Date(review.created_at).toLocaleDateString()}</small>
                    </article>
                  `).join("")}
                </div>
              `}
            </div>
          </section>

           
          <section id="settings" class="tab-content" role="tabpanel">
            <div class="settings-grid">
              <div class="account-card settings-card">
                <h2>Change Password</h2>
                <form onsubmit="return handlePasswordChange(event)">
                  <label class="setting-label" for="currentPassword">Current Password</label>
                  <input type="password" id="currentPassword" required autocomplete="current-password">
                  <label class="setting-label" for="newPassword">New Password</label>
                  <input type="password" id="newPassword" required minlength="6" autocomplete="new-password">
                  <label class="setting-label" for="confirmPassword">Confirm New Password</label>
                  <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password">
                  <button type="submit" class="btn btn-primary" style="margin-top:1.25rem; width:100%;">Update Password</button>
                </form>
              </div>

              <div class="account-card settings-card">
                <h2>Notification Preferences</h2>
                <label class="check-row"><input type="checkbox" checked onchange="savePreference(this)"> Email me about new products</label>
                <label class="check-row"><input type="checkbox" checked onchange="savePreference(this)"> Order status updates</label>
                <label class="check-row"><input type="checkbox" checked onchange="savePreference(this)"> Promotional offers &amp; discounts</label>
                <label class="check-row"><input type="checkbox" onchange="savePreference(this)"> Product review reminders</label>
              </div>

              <div class="account-card settings-card">
                <h2>Account Security</h2>
                <div class="detail-row">
                  <div class="detail-label">Two-Factor Authentication</div>
                  <div class="detail-value"><label class="check-row" style="border:none; padding-top:0.25rem;"><input type="checkbox" onchange="savePreference(this)"> Enable 2FA (demo)</label></div>
                </div>
                <div class="detail-row">
                  <div class="detail-label">Active Sessions</div>
                  <div class="detail-value">This device &middot; ${new Date().toLocaleString()}</div>
                </div>
                <div class="danger-divider" style="margin-top:1.5rem; padding-top:1.25rem;">
                  <h3 style="font-weight:600; margin-bottom:1rem; color:#FCA5A5;">Danger Zone</h3>
                  <button onclick="handleLogout()" class="btn btn-danger" style="padding:0.65rem 1.25rem;">Logout</button>
                  <button onclick="deleteAccount()" class="btn btn-danger" style="padding:0.65rem 1.25rem; margin-left:0.5rem; opacity:0.7;">Delete Account</button>
                </div>
              </div>
            </div>
          </section>
        </div>
      `;
    });

     
    function switchTab(tabName) {
      document.querySelectorAll(".tab-content").forEach(tab => {
        tab.classList.toggle("active", tab.id === tabName);
      });
      document.querySelectorAll(".tab-btn").forEach(btn => {
        const isActive = btn.dataset.tab === tabName;
        btn.classList.toggle("active", isActive);
        btn.setAttribute("aria-selected", isActive ? "true" : "false");
      });
    }

    function handlePasswordChange(event) {
      event.preventDefault();
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      if (newPassword !== confirmPassword) {
        showNotification("New passwords do not match.", "error");
        return false;
      }
      showNotification("Password updated successfully (demo).", "success");
      event.target.reset();
      return false;
    }

    function savePreference(input) {
      showNotification("Preferences saved (demo).", "success");
    }

    function viewOrder(orderId) {
      const order = (window.accountOrders || []).find(item => Number(item.id) === Number(orderId)) || cartManager.getOrder(orderId);
      if (!order) {
        showNotification("Order details are not available.", "error");
        return;
      }

      const shipping = order.shippingDetails || {};
      const products = database.getProducts();
      const fmt = n => "₱" + Number(n || 0).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      const statusClass = "is-" + String(order.status || "pending").toLowerCase();
      const statusLabel = String(order.status || "pending").charAt(0).toUpperCase() + String(order.status || "").slice(1);
      const orderDate = order.createdAt ? new Date(order.createdAt).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" }) : "—";

      const itemsHTML = (order.items || []).map(item => {
        const product = products.find(p => Number(p.id) === Number(item.id));
        const img = product ? product.image_url : (item.image_url || "assets/default-tech-placeholder.svg");
        return `
          <div class="order-modal-item">
            <img src="${img}" alt="${item.name}" class="order-modal-item-img" onerror="this.src='assets/default-tech-placeholder.svg'">
            <div class="order-modal-item-info">
              <div class="order-modal-item-name">${item.name}</div>
              <div class="order-modal-item-qty">Qty: ${item.quantity || 1} × ${fmt(item.price)}</div>
            </div>
            <div class="order-modal-item-price">${fmt((item.price || 0) * (item.quantity || 1))}</div>
          </div>
        `;
      }).join("") || `<div class="order-modal-item"><div class="order-modal-item-qty">No item details</div></div>`;

      const overlay = document.createElement("div");
      overlay.className = "order-modal-overlay";
      overlay.innerHTML = `
        <div class="order-modal" role="dialog" aria-modal="true" aria-label="Order details">
          <div class="order-modal-header">
            <h2>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
              Order ${order.orderNumber || ""}
            </h2>
            <button type="button" class="order-modal-close" aria-label="Close" data-close>&times;</button>
          </div>
          <div class="order-modal-body">
            <div class="order-modal-meta">
              <div class="order-modal-meta-item">
                <div class="order-modal-meta-label">Date Placed</div>
                <div class="order-modal-meta-value">${orderDate}</div>
              </div>
              <div class="order-modal-meta-item">
                <div class="order-modal-meta-label">Status</div>
                <div class="order-modal-meta-value"><span class="order-modal-status ${statusClass}">${statusLabel}</span></div>
              </div>
            </div>

            <div class="order-modal-section-title">Items</div>
            <div class="order-modal-items">${itemsHTML}</div>

            ${shipping.recipientName || shipping.streetAddress ? `
              <div class="order-modal-section-title">Delivery Address</div>
              <div class="order-modal-shipping">
                <strong>${shipping.recipientName || ""}</strong><br>
                ${shipping.streetAddress || ""}<br>
                ${shipping.city || ""}${shipping.city ? ", " : ""}${shipping.state || ""} ${shipping.postalCode || ""}
              </div>
            ` : ""}

            <div class="order-modal-totals">
              <div class="order-modal-total-row">
                <span>Order Total</span>
                <span>${fmt(order.total)}</span>
              </div>
            </div>
          </div>
        </div>
      `;

      const close = () => {
        overlay.classList.add("is-closing");
        setTimeout(() => overlay.remove(), 180);
        document.removeEventListener("keydown", onKey);
      };
      const onKey = e => { if (e.key === "Escape") close(); };

      overlay.addEventListener("click", e => {
        if (e.target === overlay || e.target.closest("[data-close]")) close();
      });
      document.addEventListener("keydown", onKey);
      document.body.appendChild(overlay);
    }

    function editProfile() {
      alert("Profile editing coming soon!");
    }

    function deleteAccount() {
      if (confirm("Are you sure you want to delete your account? This action cannot be undone.")) {
        alert("Account deletion not available in demo.");
      }
    }
 </script>
</body>

</html>
