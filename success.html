<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Successful - Byte Cart</title>
  <link rel="stylesheet" href="css/styles.css?v=28">
  <link rel="stylesheet" href="css/transitions.css">
</head>

<body>
  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="logo"><img src="assets/shopping cart image.png" alt="Byte Cart logo"><span
          class="logo-byte">Byte</span><span class="logo-cart">Cart</span></a>
      <div class="nav-center">
        <a href="products.html">All Products</a>
        <a href="products.html?category=electronics">Electronics</a>
        <a href="products.html?category=wearables">Wearables</a>
        <a href="products.html?category=accessories">Accessories</a>
      </div>
      <div class="nav-right">
        <div id="userMenu"></div>
        <div id="authButtons" class="nav-auth-links">
          <a href="login.html" class="nav-login-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" aria-hidden="true">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
              <polyline points="10 17 15 12 10 7" />
              <line x1="15" y1="12" x2="3" y2="12" />
            </svg>
            Login
          </a>
          <a href="login.html#register" class="nav-register-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" aria-hidden="true">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
              <circle cx="8.5" cy="7" r="4" />
              <line x1="20" y1="8" x2="20" y2="14" />
              <line x1="23" y1="11" x2="17" y2="11" />
            </svg>
            Register
          </a>
        </div>
        <a href="cart.html" class="cart-icon" aria-label="View shopping cart">
          <svg class="cart-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="21" r="1" />
            <circle cx="20" cy="21" r="1" />
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
          </svg>
          <span class="cart-count" id="cartCount">0</span>
        </a>
      </div>
    </div>
  </nav>
  <div class="container" style="padding: 3rem 1rem; min-height: 60vh;">
    <div id="successContent"
      style="max-width: 720px; margin: 0 auto; background: #1E293B; border: 1px solid rgba(51, 65, 85, 0.7); border-radius: 1rem; padding: 2.5rem; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);"></div>
  </div>
  <footer class="footer">
    <div class="footer-content">
      <div class="footer-section">
        <h3>About Byte Cart</h3>
        <p>An educational prototype. No real transactions are processed.</p>
      </div>
      <div class="footer-section">
        <h3>Quick Links</h3>
        <a href="#">Shop</a>
        <a href="#">About Us</a>
        <a href="#">Contact</a>
      </div>
      <div class="footer-section">
        <h3>Customer Support</h3>
        <a href="faq.html">Help Center / FAQ</a>
        <a href="faq.html#shipping">Shipping Info</a>
      </div>
            <div class="footer-section">
        <h3>Connect</h3>
        <div id="footerSocial" class="footer-social" aria-label="Social media links"></div>
      </div>
    </div>
    <div class="footer-bottom">
      <p id="footerCopyright">© 2026 ByteCart. All rights reserved.</p>
    </div>
  </footer>
  <script src="js/database.js?v=7"></script>
  <script src="data/products.js"></script>
  <script src="js/auth.js?v=3"></script>
  <script src="js/cart.js?v=8"></script>
  <script src="js/app.js?v=20"></script>
  <script src="js/site.js?v=6"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const orderId = parseInt(params.get("orderId"));

      if (!orderId) {
        document.getElementById("successContent").innerHTML = `
          <div class="text-center">
          <h1 style="font-size: 2rem; font-weight: bold; margin-bottom: 1rem; color: #F8FAFC;">Order Not Found</h1>
            <a href="index.html" class="btn btn-primary">Back to Home</a>
          </div>
        `;
        return;
      }

      const order = cartManager.getOrder(orderId);

      if (!order) {
        document.getElementById("successContent").innerHTML = `
          <div class="text-center">
          <h1 style="font-size: 2rem; font-weight: bold; margin-bottom: 1rem; color: #F8FAFC;">Order Not Found</h1>
            <a href="index.html" class="btn btn-primary">Back to Home</a>
          </div>
        `;
        return;
      }

      const shippingDays = 3;
      const deliveryDate = new Date(new Date(order.createdAt).getTime() + shippingDays * 24 * 60 * 60 * 1000);

      document.getElementById("successContent").innerHTML = `
        <div style="max-width: 600px; margin: 0 auto; text-align: center;">
          <div style="width: 72px; height: 72px; margin: 0 auto 1.25rem; border-radius: 50%; background: rgba(16, 185, 129, 0.12); border: 2px solid #10b981; display: flex; align-items: center; justify-content: center; color: #10b981;">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="20 6 9 17 4 12" />
            </svg>
          </div>

          <h1 style="font-size: 2rem; font-weight: 700; color: #10B981; margin-bottom: 0.5rem;">Order Confirmed!</h1>
          <p style="font-size: 1rem; color: #A5B4D4; margin-bottom: 2rem;">Thank you for your purchase</p>

          <div style="background: rgba(11, 17, 32, 0.5); border: 1px solid rgba(51, 65, 85, 0.7); border-radius: 0.5rem; padding: 2rem; margin-bottom: 2rem;">
            <div style="margin-bottom: 1.5rem;">
              <p style="font-size: 0.78rem; color: #93C5FD; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.25rem;">Order Number</p>
              <p style="font-size: 1.35rem; font-weight: 700; color: #F8FAFC;">${order.orderNumber}</p>
            </div>

            <div style="margin-bottom: 1.5rem;">
              <p style="font-size: 0.78rem; color: #93C5FD; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.25rem;">Order Date</p>
              <p style="font-size: 1rem; font-weight: 500; color: #E2E8F0;">${new Date(order.createdAt).toLocaleDateString()} at ${new Date(order.createdAt).toLocaleTimeString()}</p>
            </div>

            <div style="margin-bottom: 1.5rem;">
              <p style="font-size: 0.78rem; color: #93C5FD; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.25rem;">Estimated Delivery</p>
              <p style="font-size: 1rem; font-weight: 500; color: #E2E8F0;">${deliveryDate.toLocaleDateString()}</p>
            </div>

            <div style="margin-bottom: 0;">
              <p style="font-size: 0.78rem; color: #93C5FD; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.25rem;">Order Total</p>
              <p style="font-size: 1.35rem; font-weight: 700; color: #F8FAFC;">PHP ${Number(order.total).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ",")}</p>
            </div>
          </div>

          <div style="background: rgba(37, 99, 235, 0.1); border-radius: 0.5rem; padding: 1.5rem; margin-bottom: 2rem; border-left: 4px solid #2563eb; text-align: left;">
            <h3 style="font-weight: 600; margin-bottom: 0.5rem; color: #F8FAFC;">Shipping Address</h3>
            <p style="color: #A5B4D4; line-height: 1.6;">
              ${order.shippingDetails.recipientName}<br>
              ${order.shippingDetails.streetAddress}<br>
              ${order.shippingDetails.city}, ${order.shippingDetails.state} ${order.shippingDetails.postalCode}<br>
              ${order.shippingDetails.country}
            </p>
          </div>

          <div style="background: rgba(11, 17, 32, 0.5); border: 1px solid rgba(51, 65, 85, 0.7); border-radius: 0.5rem; padding: 1.5rem; margin-bottom: 2rem;">
            <h3 style="font-weight: 600; margin-bottom: 1rem; color: #F8FAFC;">Order Items</h3>
            <div style="text-align: left;">
              ${order.items.map(item => `
                <div style="display: flex; justify-content: space-between; padding: 0.75rem 0; border-bottom: 1px solid rgba(51, 65, 85, 0.5);">
                  <div>
                    <p style="font-weight: 500; color: #E2E8F0;">${item.name}</p>
                    <p style="font-size: 0.875rem; color: #94A3B8;">Qty: ${item.quantity}</p>
                  </div>
                  <p style="font-weight: 600; color: #E2E8F0;">PHP ${(item.price * item.quantity).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ",")}</p>
                </div>
              `).join("")}
            </div>
          </div>

          <div style="margin-bottom: 2rem;">
            <p style="color: #94A3B8; margin-bottom: 1rem;">A confirmation email has been sent to ${authManager.getCurrentUser().email}</p>
          </div>

          <div style="display: flex; gap: 1rem; justify-content: center;">
            <a href="account.html" class="btn btn-primary">View Order Details</a>
            <a href="products.html" class="btn btn-secondary">Continue Shopping</a>
          </div>

          <div style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid #e5e7eb;">
            <p style="font-size: 0.875rem; color: #94A3B8;">
              Need help? <a href="about.html#contact" style="color: #93C5FD; text-decoration: none;">Contact support</a>
            </p>
          </div>
        </div>
      `;
    });
  </script>
</body>

</html>
